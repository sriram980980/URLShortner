input {
  tcp {
    port => 5000
    codec => json_lines
    type => "spring-boot"
    add_field => { "input_type" => "tcp" }
  }

  beats {
    port => 5044
    type => "beats"
    add_field => { "input_type" => "beats" }
  }
}

filter {
  if [type] == "spring-boot" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \[%{DATA:trace_id},%{DATA:span_id}\] \[%{DATA:thread}\] %{LOGLEVEL:log_level} %{DATA:logger} - %{GREEDYDATA:log_message}"
      }
      overwrite => [ "message" ]
      tag_on_failure => []
    }

    if !("_grokparsefailure" in [tags]) {
      grok {
        match => {
          "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \[%{DATA:thread}\] %{LOGLEVEL:log_level} %{DATA:logger} - %{GREEDYDATA:log_message}"
        }
        overwrite => [ "message" ]
        tag_on_failure => []
      }
    }

    date {
      match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
      timezone => "UTC"
    }

    grok {
      match => { "logger" => "org\.ram\.url\.shortner\.%{DATA:service}" }
      tag_on_failure => []
    }
  }

  if [type] == "beats" {
    if [fields][service] {
      mutate { add_field => { "service" => "%{[fields][service]}" } }
    }
    if [fields][environment] {
      mutate { add_field => { "environment" => "%{[fields][environment]}" } }
    }
  }

  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
    if [parsed] {
      mutate { remove_field => [ "message" ] }
    }
  }

  if [log_level] {
    mutate { lowercase => [ "log_level" ] }
  }

  if ![environment] {
    mutate { add_field => { "environment" => "development" } }
  }

  mutate {
    remove_field => [ "[host][os][platform]", "[host][os][build]" ]
  }

  fingerprint {
    source => [ "message", "logger", "log_level" ]
    target => "fingerprint"
    method => "MURMUR3"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "url-shortner-logs-%{+YYYY.MM.dd}"
    action => "index"
    document_id => "%{fingerprint}"
  }
}
