# Redis Configuration File
# URL Shortener - Hybrid Persistence (RDB + AOF)

# Network and General
bind 0.0.0.0
port 6379
protected-mode no
timeout 0
tcp-keepalive 300
daemonize no

# Logging
loglevel notice
logfile ""
databases 16

# RDB Persistence - Snapshot-based
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Persistence - Append-only file
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Hybrid Persistence (RDB + AOF Combined)
aof-use-rdb-preamble yes

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Eviction Policies
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Replication (for future HA setup)
repl-diskless-sync no
repl-diskless-sync-delay 5

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Slowlog
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 0

# Event notification
notify-keyspace-events ""

# Advanced configuration
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Lua scripting
lua-time-limit 5000

# Cluster configuration (disabled for single instance)
cluster-enabled no

# ACL configuration (optional - use for production)
# requirepass ""

# Performance tuning
always-show-logo yes
